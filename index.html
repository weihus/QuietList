<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      if (location.hash.startsWith('#sync=')) {
        const secret = new URLSearchParams(location.hash.slice(1)).get('sync');
        history.replaceState(null, '', location.pathname + location.search);
        window.__quietlistSyncSecret = secret;
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QuietList" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      try {
        const theme = localStorage.getItem('quietlist.theme');
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
    <title>QuietList</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
